[project]
name = "mcp-preflight"
version = "0.1.0"
description = "Check a remote MCP server before you register it in Leena AI's Custom MCP connector"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.scripts]
mcp-preflight = "mcp_preflight.cli:main"

[dependency-groups]
dev = ["pytest>=8", "mcp>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_preflight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
